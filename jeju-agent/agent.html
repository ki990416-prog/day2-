<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>제주 특산물 에이전트</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Malgun Gothic", sans-serif; background: #fff8ef; color: #2b2b2b; height: 100vh; display: flex; flex-direction: column; }
  header { background: linear-gradient(135deg, #f58a1f, #ffb347); color: #fff; text-align: center; padding: 14px 16px; }
  header h1 { margin: 0; font-size: 1.3rem; }
  header p { margin: 2px 0 0; font-size: .85rem; opacity: .95; }
  #chat { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; max-width: 720px; width: 100%; margin: 0 auto; }
  .row { display: flex; }
  .row.me { justify-content: flex-end; }
  .row.bot { justify-content: flex-start; }
  .bubble { max-width: 75%; padding: 10px 14px; border-radius: 18px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
  .me .bubble { background: #f58a1f; color: #fff; border-bottom-right-radius: 4px; }
  .bot .bubble { background: #fff; color: #2b2b2b; border-bottom-left-radius: 4px; }
  form { display: flex; gap: 8px; padding: 12px 16px; background: #fff; border-top: 1px solid #eee; max-width: 720px; width: 100%; margin: 0 auto; }
  input { flex: 1; min-width: 0; padding: 11px 14px; font-size: 1rem; border: 1px solid #ddd; border-radius: 999px; outline: none; }
  input:focus { border-color: #f58a1f; }
  button { padding: 0 20px; font-size: 1rem; font-weight: bold; border: none; border-radius: 999px; background: #f58a1f; color: #fff; cursor: pointer; }
  button:hover { background: #d96f06; }
  .note { text-align: center; font-size: .72rem; color: #999; padding: 4px 8px 10px; background: #fff; }
</style>
</head>
<body>

<header>
  <h1>🍊 제주 특산물 에이전트</h1>
  <p>제주도 특산물에 대해서 알아보는 기능</p>
</header>

<div id="chat" aria-live="polite"></div>

<form id="form" autocomplete="off">
  <input id="msg" type="text" placeholder="메시지를 입력하세요" aria-label="메시지 입력">
  <button type="submit">보내기</button>
</form>
<div class="note">※ 지금 답변은 미리 정해 둔 가짜 답이에요. 진짜 답은 5일차에 연결됩니다.</div>

<script>
  const REPLIES = [
    '안녕하세요! 저는 제주도 특산물을 알려 드리는 에이전트예요 🍊\n감귤, 한라봉, 흑돼지, 갈치 중에 어떤 게 가장 궁금하세요?',
    '그럼 추천 하나 드릴게요! 지금 같은 늦가을~겨울에는 노지감귤이 제철이에요 🍊\n새콤달콤해서 간식으로 딱 좋아요.',
    '아직 공부 중이에요! 5일차에 진짜로 알아볼게요.'
  ];
  let turn = 0;
  const chat = document.getElementById('chat');
  const input = document.getElementById('msg');

  function add(who, text) {
    const row = document.createElement('div');
    row.className = 'row ' + who;
    const b = document.createElement('div');
    b.className = 'bubble';
    b.textContent = text;            // textContent 로 넣어서 입력한 글이 HTML로 해석되지 않게 함
    row.appendChild(b);
    chat.appendChild(row);
    chat.scrollTop = chat.scrollHeight;
  }

  document.getElementById('form').addEventListener('submit', e => {
    e.preventDefault();               // 보내기 버튼과 Enter 둘 다 여기로 들어옴
    const text = input.value.trim();
    if (!text) return;
    add('me', text);
    input.value = '';
    const reply = REPLIES[turn % REPLIES.length];
    turn++;
    setTimeout(() => add('bot', reply), 1000);
  });

  input.focus();
</script>
</body>
</html>
